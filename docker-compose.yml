# SECURITY NOTE: the "prod" profile below builds production-style
# containers (nginx serving the built frontend, no dev tooling) — it does
# NOT mean "safe to expose beyond your own machine." There is no
# authentication anywhere in the API (see README.md's maturity table:
# "App UI + local run: Runnable; no auth" / "Hosted production: Not
# ready"), and nginx.conf is a bare reverse proxy with no auth layer of
# its own. If you run the "prod" profile anywhere reachable beyond
# localhost, put your own auth in front of it (reverse-proxy basic auth,
# VPN, Tailscale, etc.) first.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    volumes:
      - ./projects:/app/projects
      - ./projects.db:/app/projects.db
    expose:
      - "8000"
    profiles:
      - dev
      - prod

  web-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: /api
      VITE_WS_URL: ws://localhost:5173/ws
      VITE_PROXY_API_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
    depends_on:
      - api
    profiles:
      - dev

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api
    profiles:
      - prod
